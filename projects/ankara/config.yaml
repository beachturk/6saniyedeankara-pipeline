display_name: "Saniyede Çankaya"
handle: "@saniyedecankaya"
hashtag: "#Çankaya #SaniyedeCankaya"

output_type: video   # "video" (6 saniyelik Reels, marka adına uygun) | "image" (statik feed post)
video:
  # duration_s belirtilmedi -> özet metninin uzunluğuna göre otomatik hesaplanır
  # (kelime kelime yazma efekti bitene kadar), min 6, max_duration_s'i geçmez.
  max_duration_s: 10
  fps: 30

# NOT (2026-10-03): Proje "6 Saniyede Ankara" -> "Saniyede Çankaya" olarak
# daraltıldı, artık SADECE Çankaya ilçesini ilgilendiren haberler paylaşılıyor.
# Aşağıdaki kaynaklar hâlâ Ankara-geneli RSS besliyor (Çankaya'ya özel RSS'i
# olmayan kaynaklar) - ilçe filtresi mekanik değil, aşağıdaki extra_rules
# üzerinden LLM seçim adımında uygulanıyor (bkz. core/filters.py docstring).
# Araştırılan ama RSS'i OLMAYAN istenen kaynaklar (core/rss_fetch.py sadece
# gerçek RSS/XML feed'leri okuyabiliyor - feedparser ile):
#   - https://www.cankaya.bel.tr/haberler (RSS yok, düz HTML liste)
#   - https://www.hurriyet.com.tr/ankara/cankaya-haberleri/ (RSS yok)
#   - https://www.sozcu.com.tr/cankaya-t1792 (Sözcü'de coğrafi/ilçe bazlı RSS hiç yok)
#   - https://www.sondakika.com/cankaya/ (RSS yok)
#   - Instagram (@cankayasondakiika) / X (@cankaya_haber): RSS yok, otomatik
#     çekim için resmi API gerekir ya da scraping gerekir (ToS riski) - bu
#     pipeline'a eklenmedi.
rss_sources:
  - key: haberler
    url: "https://rss.haberler.com/rssnew.aspx?kategori=ankara"
  - key: haberankara
    url: "https://www.haberankara.com/rss"
  - key: yeniankara
    url: "https://www.yeniankara.com.tr/export/rss"
  - key: sabahankara
    url: "https://www.sabah.com.tr/rss/ankara.xml"

# Çankaya Belediyesi'nin resmi haber sayfasında RSS YOK (sadece düz HTML
# liste). core/html_scrape.py bunun için özel/kırılgan bir scraper içeriyor
# (bkz. o dosyanın başındaki uyarı). Diğer araştırılan RSS'siz kaynaklar
# (Hürriyet/Sözcü/Sondakika ilçe sayfaları) kullanıcı kararıyla EKLENMEDİ -
# zaten genel RSS kaynaklarından benzer haberler geliyor.
html_sources:
  - key: cankayabel
    parser: cankaya_bel
    url: "https://www.cankaya.bel.tr/haberler"

filters:
  max_age_hours: 36
  candidate_limit: 10
  extra_rules: |
    - SADECE Ankara'nın ÇANKAYA İLÇESİ ile doğrudan ilgili haberler seçilir
      (olay Çankaya sınırları içinde geçmeli, ya da doğrudan Çankaya
      Belediyesi/Çankaya'daki bir kurum/kişi ile ilgili olmalı).
    - Haberin başlığında/özetinde "Çankaya" GEÇMİYORSA ve haberin Çankaya'da
      geçtiği metinden ANLAŞILMIYORSA, bu haber SEÇİLMEZ - Ankara'nın diğer
      ilçeleri (Keçiören, Yenimahalle, Mamak, Etimesgut, Sincan, vb.) veya
      genel/ulusal haberler KESİNLİKLE ELENİR.
    - Aday havuzunda Çankaya ile ilgili HİÇBİR haber yoksa, diğer Ankara
      haberlerinden birini seçerek "en yakın" diye yetinme - selected_guid:
      null dön ve hiçbir şey seçme. Bu turda paylaşım yapılmaması, alakasız
      bir haber paylaşmaktan daha iyidir.
    - "Semicenk konserinde kavga" gibi görseli olmayan ya da dedikodu/magazin
      tonundaki içerikler tercih edilmemeli; ciddi yerel haber önceliklidir.

llm:
  provider: claude
  model: claude-haiku-4-5-20251001

image:
  bg_color: "#0b1730"
  badge_color: "#e63946"
  badge_text_color: "#ffffff"
  headline_color: "#ffffff"
  # summary_color, handle_color, photo_height_ratio artik core/image_gen.py
  # DEFAULTS'tan geliyor (2026-08-31 kalite duzeltmesi): fotograf artik TAM
  # EKRAN (photo_height_ratio: 1.0 - eskiden 0.58 idi, alt kisim bos/lacivert
  # kaliyordu), summary/handle renkleri daha parlak/okunakli beyaza cekildi
  # (eskiden donuk gri-mavi #c9d3e0 / #5c6b84 idi - "renk tonu guzel degil"
  # sikayeti).

instagram:
  # NOT: Secret adlari hala *_ANKARA - bu klasor adi (projects/ankara) ile
  # eslesiyor ve GitHub Actions bu secret adini klasor adindan otomatik
  # turetiyor (bkz. .github/workflows/pipeline.yml). Ayni Instagram hesabi
  # (sadece kullanici adi @saniyedecankaya olarak degisti), ayni token/ID -
  # klasoru/secreti yeniden adlandirmak ekstra risksiz bir fayda saglamiyor,
  # o yuzden dokunulmadi.
  business_id: "${IG_BUSINESS_ID_ANKARA}"
  access_token: "${IG_ACCESS_TOKEN_ANKARA}"
